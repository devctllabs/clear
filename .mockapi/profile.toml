schemaVersion = 1

[generator]
name = "mockapi"
version = "0.1.0"

[project]
root = "."

[project.target]
packagePath = "api/mock-server"
packageName = "@local/mock-server"
serverName = "Mock API"

[[apis]]
name = "clear-web-api"
openapi = "api/openapi/openapi.yaml"
basePath = "/api/v1"
contractOutput = "src/generated/clear-web-api/contract"
runtimeOutput = "src/generated/clear-web-api/mock-runtime.ts"

[[features]]
name = "bootstrap"
operations = ["bootstrap"]

[[features]]
name = "workspaces"
stateSlices = ["workspaces", "activeWorkspace", "idCounters"]
operations = [
  "listWorkspaces",
  "createWorkspace",
  "getActiveWorkspace",
  "setActiveWorkspace",
  "deleteWorkspace",
  "getWorkspace",
  "updateWorkspace",
]

[[features]]
name = "folders"
stateSlices = ["folders"]
operations = [
  "listWorkspaceFolders",
  "listFolderFolders",
  "createFolder",
  "deleteFolder",
  "getFolder",
  "updateFolder",
  "getFolderPath",
]

[[features]]
name = "decks"
stateSlices = ["decks"]
operations = [
  "listWorkspaceDecks",
  "listFolderDecks",
  "createDeck",
  "deleteDeck",
  "getDeck",
  "updateDeck",
]

[[features]]
name = "notes"
stateSlices = ["notes"]
operations = [
  "listNotesByDeck",
  "createNote",
  "deleteNote",
  "getNote",
  "updateNote",
]

[[features]]
name = "review"
stateSlices = ["reviewSessions"]
operations = [
  "startReviewSession",
  "getReviewSession",
  "gradeReviewSessionCard",
]

[[features]]
name = "settings"
stateSlices = ["settings"]
operations = [
  "getSettings",
  "updateSettings",
  "getDefaultSettings",
  "resetSettings",
]

[[features]]
name = "trash"
stateSlices = ["trash"]
operations = [
  "emptyTrash",
  "getTrash",
  "restoreTrashItem",
  "deleteTrashItem",
]

[[features]]
name = "search"
operations = ["searchContent"]

[state]
schemaVersion = 1

[[state.slices]]
name = "workspaces"
recordType = "Workspace"
schemaRef = "clear-web-api#/components/schemas/Workspace"
array = true
idField = "id"
softDeleteField = "deletedAt"

[[state.slices]]
name = "activeWorkspace"
recordType = "ActiveWorkspace"
schemaRef = "clear-web-api#/components/schemas/ActiveWorkspace"
array = false

[[state.slices]]
name = "folders"
recordType = "Folder"
schemaRef = "clear-web-api#/components/schemas/Folder"
array = true
idField = "id"
softDeleteField = "deletedAt"

[[state.slices]]
name = "decks"
recordType = "Deck"
schemaRef = "clear-web-api#/components/schemas/Deck"
array = true
idField = "id"
softDeleteField = "deletedAt"

[[state.slices]]
name = "notes"
recordType = "NoteDetail"
schemaRef = "clear-web-api#/components/schemas/NoteDetail"
array = true
idField = "id"
softDeleteField = "deletedAt"

[[state.slices]]
name = "reviewSessions"
recordType = "ReviewSession"
schemaRef = "clear-web-api#/components/schemas/ReviewSession"
array = true
idField = "id"

[[state.slices]]
name = "settings"
recordType = "Settings"
schemaRef = "clear-web-api#/components/schemas/Settings"
array = false

[[state.slices]]
name = "trash"
recordType = "TrashState"
schemaRef = "clear-web-api#/components/schemas/TrashState"
array = false

[[state.slices]]
name = "idCounters"
recordType = "Record<string, number>"
array = false

