[package]
name = "clear-tauri"
version = "0.1.0"
description = "Tauri shell for Clear"
authors = ["devctllabs"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "clear_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
log = "0.4"
clear-core = { path = "../crates/clear-core" }
clear-migrator = { path = "../crates/clear-migrator" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2.6.0"
