name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-rust.yml
      - rust/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-rust.yml
      - rust/**

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v5
        with:
          path: rust/target/
          key: ${{ runner.os }}-cargo-target-1.96-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-1.96-

      - name: Run Rust check
        run: cargo check --manifest-path rust/Cargo.toml

      - name: Run Tauri check
        run: cargo check --manifest-path rust/tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml
