version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      tauri-stack:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - tauri*
          - tauri-plugin*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      tanstack:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "@tanstack/*"
        exclude-patterns:
          - "@tanstack/router-plugin"
          - "@tanstack/router-cli"

      ui-runtime:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - react
          - react-dom
          - "@radix-ui/*"
          - "@tauri-apps/*"
          - axios
          - class-variance-authority
          - clsx
          - i18next
          - react-i18next
          - react-markdown
          - remark-gfm
          - tailwind-merge
          - tailwindcss
          - "@tailwindcss/*"
          - zod
          - zustand
          - lucide-react

      mock-api-tooling:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "@hono/node-server"
          - hono
          - tsx
          - yaml
          - esbuild
          - "@types/node"

      codegen:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "@hey-api/openapi-ts"
          - "@tanstack/router-plugin"
          - "@tanstack/router-cli"

      ui-testing:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "@storybook/*"
          - "storybook*"
          - "@vitest/*"
          - vitest
          - "@testing-library/*"
          - jsdom
          - msw
          - playwright

      tooling:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - eslint*
          - typescript*
          - vite
          - "@vitejs/*"
          - depcheck
          - globals
