components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Workspace identifier.

    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Folder identifier.

    DeckId:
      name: deckId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Deck identifier.

    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Note identifier.

    CardId:
      name: cardId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Review card identifier.

    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Review session identifier.

    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Trash item identifier.

    DeckSortField:
      name: sortField
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DeckSortField'
      description: Optional field used for deck collection sorting.

    FolderSortField:
      name: sortField
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FolderSortField'
      description: Optional field used for folder collection sorting.

    NoteSortField:
      name: sortField
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NoteSortField'
      description: Optional field used for note collection sorting.

    SortDirection:
      name: sortDirection
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SortDirection'
      description: Optional collection sorting direction.

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            badRequest:
              value:
                type: /problems/bad-request
                title: Bad Request
                status: 400
                detail: Request body is malformed.
                retryable: false

    Validation:
      description: The request failed domain validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation:
              value:
                type: /problems/validation
                title: Validation Failed
                status: 422
                retryable: false
                issues:
                  - path:
                      - title
                    code: required

    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: The caller is not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              value:
                type: /problems/not-found
                title: Not Found
                status: 404
                detail: Workspace not found.
                retryable: false
                entity: workspace
                entityId: editorial-production

    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Timeout:
      description: The operation timed out.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unavailable:
      description: The service is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unexpected:
      description: An unexpected error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Id:
      type: string
      minLength: 1
      example: editorial-production

    DateTime:
      type: string
      format: date-time
      example: '2026-05-15T12:00:00.000Z'

    DeckSortField:
      type: string
      enum:
        - dueToday
        - title
        - updatedAt
      example: title

    FolderSortField:
      type: string
      enum:
        - title
        - updatedAt
      example: title

    NoteSortField:
      type: string
      enum:
        - dueAt
        - progress
        - title
        - updatedAt
      example: title

    SortDirection:
      type: string
      enum:
        - asc
        - desc
      example: asc

    VisualIconName:
      type: string
      minLength: 1
      description: Lucide icon name used by the UI visual picker.
      example: book-open

    ProblemType:
      type: string
      format: uri-reference
      enum:
        - /problems/bad-request
        - /problems/conflict
        - /problems/forbidden
        - /problems/not-found
        - /problems/timeout
        - /problems/unauthorized
        - /problems/unexpected
        - /problems/unavailable
        - /problems/validation
      example: /problems/validation

    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        path:
          type: array
          items:
            type: string
        code:
          type: string
          minLength: 1
        params:
          type: object
          additionalProperties: true
      example:
        path:
          - title
        code: required

    ValidationProblemDetails:
      type: object
      additionalProperties: false
      required:
        - issues
        - retryable
        - status
        - title
        - type
      properties:
        type:
          type: string
          enum:
            - /problems/validation
          format: uri-reference
        title:
          type: string
          minLength: 1
          example: Validation Failed
        status:
          type: integer
          enum:
            - 422
        detail:
          type: string
          minLength: 1
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        retryable:
          type: boolean
          enum:
            - false
      example:
        type: /problems/validation
        title: Validation Failed
        status: 422
        retryable: false
        issues:
          - path:
              - title
            code: required

    MessageProblemDetails:
      type: object
      additionalProperties: false
      required:
        - retryable
        - status
        - title
        - type
      properties:
        type:
          type: string
          format: uri-reference
          enum:
            - /problems/bad-request
            - /problems/conflict
            - /problems/forbidden
            - /problems/not-found
            - /problems/timeout
            - /problems/unauthorized
            - /problems/unexpected
            - /problems/unavailable
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        retryable:
          type: boolean
        entity:
          type: string
        entityId:
          type: string

    ProblemDetails:
      oneOf:
        - $ref: '#/components/schemas/ValidationProblemDetails'
        - $ref: '#/components/schemas/MessageProblemDetails'
      discriminator:
        propertyName: type
        mapping:
          /problems/bad-request: '#/components/schemas/MessageProblemDetails'
          /problems/conflict: '#/components/schemas/MessageProblemDetails'
          /problems/forbidden: '#/components/schemas/MessageProblemDetails'
          /problems/not-found: '#/components/schemas/MessageProblemDetails'
          /problems/timeout: '#/components/schemas/MessageProblemDetails'
          /problems/unauthorized: '#/components/schemas/MessageProblemDetails'
          /problems/unexpected: '#/components/schemas/MessageProblemDetails'
          /problems/unavailable: '#/components/schemas/MessageProblemDetails'
          /problems/validation: '#/components/schemas/ValidationProblemDetails'
      examples:
        - type: /problems/validation
          title: Validation Failed
          status: 422
          retryable: false
          issues:
            - path:
                - title
              code: required
        - type: /problems/not-found
          title: Not Found
          status: 404
          detail: Note not found.
          retryable: false
          entity: note
          entityId: constitutional-crisis
